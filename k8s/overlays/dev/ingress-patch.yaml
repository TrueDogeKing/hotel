apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campcenter
spec:
  rules:
    # *.localhost resolves to 127.0.0.1 in every current browser, so this works
    # against a Docker Desktop cluster with no hosts-file entry.
    - host: campcenter.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
