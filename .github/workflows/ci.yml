name: CI

# Validates every PR to main (and pushes to main): backend build + tests, frontend lint/typecheck/build.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Weekly, so an advisory published after the last merge is still noticed.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CampCenter.slnx

      - name: Build
        run: dotnet build CampCenter.slnx -c Release --no-restore

      # Unit tests + integration tests. The integration suite uses Testcontainers, which spins up
      # PostgreSQL via the runner's Docker daemon (available on ubuntu-latest).
      - name: Test
        run: dotnet test CampCenter.slnx -c Release --no-build --verbosity normal

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # `bun run build` is `tsc -b && vite build`, so this covers the typecheck and the production bundle.
      - name: Build
        run: bun run build

  dependencies:
    name: Dependencies (vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CampCenter.slnx

      # NuGet advisories, transitive packages included. `dotnet list` exits 0 even when it
      # finds something, so the report is grepped for the severity markers it prints.
      - name: NuGet advisories
        run: |
          dotnet list CampCenter.slnx package --vulnerable --include-transitive > nuget-audit.txt
          cat nuget-audit.txt
          if grep -qiE "(Critical|High|Moderate|Low)$" nuget-audit.txt; then
            echo "::error::Vulnerable NuGet packages found (see report above)."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      # Fails the job on any advisory affecting the locked tree.
      - name: npm advisories
        working-directory: frontend
        run: bun audit
