server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (sent on every response, including errors, via "always").
    # CSP matches a Vite production build: scripts and styles come from this origin, the API is
    # same-origin (proxied below). 'unsafe-inline' is allowed for styles only (no code execution);
    # the one inline <script> in index.html (pre-paint theme switch) is allowed by its sha256 hash
    # instead — change that script and this hash must be recomputed:
    #   perl -0777 -ne 'if(/<script>(.*?)<\/script>/s){print $1}' frontend/index.html | openssl dgst -sha256 -binary | openssl base64
    # Google Fonts (stylesheet on fonts.googleapis.com, files on fonts.gstatic.com) are linked from
    # index.html; frame-src allows the Google Maps embed on the public contact section.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-AbUtfu51wXur0Hxgyl1QqpQz2yUzzC3HeBovPNzrfZs='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; worker-src 'self'; frame-src https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS is not set here: TLS terminates in front of this container, so Caddy
    # (docker/Caddyfile) sets Strict-Transport-Security for every response.

    # Proxy API calls to the backend service (docker compose service "api").
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR hub (WebSocket) to the backend.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Longer than the SignalR keep-alive so idle sockets aren't cut.
        proxy_read_timeout 120s;
    }

    # SPA fallback – wszystkie ścieżki obsługuje index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck.
    location = /health {
        access_log off;
        # Any add_header in a location drops the server-level ones, so the security
        # headers above are repeated here rather than silently lost.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
