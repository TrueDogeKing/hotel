<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome on mobile picks these up; they are --bg-body from each
         theme, so the address bar continues the page instead of framing it. -->
    <meta name="theme-color" content="#eef4f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101b1f" media="(prefers-color-scheme: dark)" />
    <title>CampCenter</title>
    <!-- Typography: Bricolage Grotesque (display) + Inter (UI). Icons are inline
         SVG (src/components/icons.tsx), so no icon web-font is needed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (light is the default).
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") === "dark" ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
