  <circle cx="16" cy="13" r="4.6" fill="#ffb956"/>
  <path d="M4 22c.9.7 1.7 1.4 3.5 1.4 3.5 0 3.5-2.8 7-2.8s3.4 2.8 7 2.8c1.8 0 2.6-.7 3.5-1.4"
        fill="none" stroke="#eef4f5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
