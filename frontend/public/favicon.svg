<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="CampCenter">
  <!-- Sun over water. A filled tile rather than a bare glyph, so the mark holds
       its own on both a light and a dark browser tab; one wave rather than
       three, because at 16px the crests close up into a smudge. -->
